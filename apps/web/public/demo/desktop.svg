<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" font-family="Segoe UI, Roboto, sans-serif">
  <rect width="1280" height="1100" fill="#ffffff"/>
  <rect width="1280" height="72" fill="#fdf2f4"/>
  <text x="32" y="46" font-size="26" font-weight="700" fill="#7a1f3d">Bloom Market</text>
  <text x="900" y="45" font-size="18" fill="#333333">Shop</text>
  <text x="970" y="45" font-size="18" fill="#333333">About</text>
  <rect x="1220" y="26" width="20" height="20" rx="3" fill="#7a1f3d"/>

  <text x="80" y="190" font-size="52" font-weight="700" fill="#1a1a1a">Fresh flowers, delivered</text>
  <text x="80" y="236" font-size="20" fill="#b0b0b0">Same-day delivery on orders placed before 2pm.</text>
  <rect x="80" y="280" width="160" height="48" rx="6" fill="#d93025"/>
  <text x="160" y="311" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Buy now</text>
  <rect x="260" y="280" width="120" height="48" rx="6" fill="#34a853"/>
  <text x="320" y="311" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">Sale</text>

  <g>
    <rect x="80" y="400" width="360" height="300" rx="8" fill="#f4f4f5"/>
    <rect x="80" y="400" width="360" height="200" rx="8" fill="#f28ab2"/>
    <circle cx="260" cy="500" r="60" fill="#e0457b"/>
    <text x="100" y="640" font-size="20" font-weight="600" fill="#1a1a1a">Peony bouquet</text>
    <text x="100" y="672" font-size="18" fill="#b0b0b0">$48</text>
  </g>
  <g>
    <rect x="460" y="400" width="360" height="300" rx="8" fill="#f4f4f5"/>
    <rect x="460" y="400" width="360" height="200" rx="8" fill="#ffd166"/>
    <circle cx="640" cy="500" r="60" fill="#f4a300"/>
    <text x="480" y="640" font-size="20" font-weight="600" fill="#1a1a1a">Sunflower jar</text>
    <text x="480" y="672" font-size="18" fill="#b0b0b0">$36</text>
  </g>
  <g>
    <rect x="840" y="400" width="360" height="300" rx="8" fill="#f4f4f5"/>
    <rect x="840" y="400" width="360" height="200" rx="8" fill="#9ad1a8"/>
    <circle cx="1020" cy="500" r="60" fill="#2e8b57"/>
    <text x="860" y="640" font-size="20" font-weight="600" fill="#1a1a1a">Fern basket</text>
    <text x="860" y="672" font-size="18" fill="#b0b0b0">$29</text>
