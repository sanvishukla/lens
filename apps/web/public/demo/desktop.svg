  <text x="80" y="790" font-size="28" font-weight="700" fill="#1a1a1a">Why Bloom</text>
  <text x="80" y="830" font-size="18" fill="#333333">Grown locally, wrapped by hand, and delivered in reusable boxes.</text>

  <rect y="1000" width="1280" height="100" fill="#2b2b2b"/>
  <text x="80" y="1058" font-size="16" fill="#8a8a8a">&#169; 2026 Bloom Market</text>
  <rect x="1100" y="1046" width="16" height="16" rx="3" fill="#8a8a8a"/>
  <rect x="1124" y="1046" width="16" height="16" rx="3" fill="#8a8a8a"/>
