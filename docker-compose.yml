services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    ports:
      - "7860:7860"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: {}
